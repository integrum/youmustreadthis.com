title: You Must Read This
description: You are here because you want to be magnificent. These books will start you on the journey. Choose the one that speaks to you.
collections:
  - books

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE.md
  - node_modules
  - package.json
  - package-lock.json
  - README.md
  - src
  - tailwind.config.js
  - netlify.toml
  - AGENTS.md
  - CLAUDE.md
  - skills-lock.json
  - docs

keep_files:
  - .git
  - .svn
  - assets/css
